services:
  db:
    image: postgres:17-alpine
    container_name: bms-db
    environment:
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: bms
      POSTGRES_DB: bms
    ports:
      - "5432:5432"
    volumes:
      - bms-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms -d bms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bms-db-data:
