[project]
name = "benefit-management-system"
version = "0.1.0"
description = "Benefit Management System API built with FastAPI and uv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dev = "app.cli:dev"
test-unit = "app.cli:test_unit"
test-acceptance = "app.cli:test_acceptance"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
