[project]
name = "benefit-management-system"
version = "0.1.0"
description = "Benefit Management System API built with FastAPI and uv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=30.0.0",
    "fastapi>=0.162.2",
    "psycopg[binary]>=3.2.0",
    "pyjwt[crypto]>=2.10",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dev = "app.cli:dev"
db-init = "app.cli:db_init"
seed = "app.cli:seed"
test-unit = "app.cli:test_unit"
test-acceptance = "app.cli:test_acceptance"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/schema.sql" = "app/schema.sql"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
